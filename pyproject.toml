[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-sim"
version = "0.1.0"
description = "Fast mobile-simulator computer-use: sim-use observes/acts; TypeSafe Jev chooses the next action."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Abenezer" }]
keywords = ["computer-use", "sim-use", "typesafe", "jev", "ios", "android", "simulator"]
dependencies = [
  "httpx>=0.27",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
jev-sim = "jev_sim.cli:main"

[project.urls]
Homepage = "https://github.com/Aben25/jev-sim"
Repository = "https://github.com/Aben25/jev-sim"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_sim"]

[tool.hatch.build.targets.sdist]
include = ["src/jev_sim", "skills", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: live sim-use / TypeSafe calls (skipped by default)",
]
addopts = "-q -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"
